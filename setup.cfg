[metadata]
name = mpd-observer
version = 0.1.0
description = Read-only kiosk display for Music Player Daemon

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
mpd_observer = static/*

[options.entry_points]
console_scripts =
    mpd-observer = mpd_observer.app:main

