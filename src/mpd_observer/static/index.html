<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPD Observer</title>
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
  <div id="artwork-backdrop" class="artwork-backdrop" aria-hidden="true">
    <img id="artwork-backdrop-image" alt="">
  </div>
  <div id="album-backdrop" class="album-backdrop" aria-hidden="true">
    <span id="album-backdrop-text"></span>
  </div>
  <main id="app" class="offline">
    <section class="artwork-wrap">
      <img id="artwork" alt="Album artwork">
      <div id="fallback" aria-hidden="true"><span>♪</span></div>
    </section>
    <section class="details">
      <h1 id="title">MPD Observer</h1>
      <div id="artist" class="artist">Waiting for the music…</div>
      <div id="album" class="album"></div>
      <div id="estimated-progress" class="estimated-progress" hidden
           role="img" aria-label="Estimated track progress">
        <span id="progress-pie" class="progress-pie" aria-hidden="true"></span>
      </div>
      <div id="progress-row" class="progress-row" hidden>
        <span id="elapsed">0:00</span>
        <div class="progress"><div id="progress-fill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </section>
    <aside>
      <div id="weather" class="weather" hidden>
        <svg class="weather-icon" viewBox="0 0 32 32" aria-hidden="true">
          <g id="weather-clear"><circle cx="16" cy="16" r="8"></circle></g>
          <g id="weather-cloud"><path d="M7 23h17a5 5 0 0 0 .3-10 8.5 8.5 0 0 0-16.2 2.5A3.8 3.8 0 0 0 7 23Z"></path></g>
          <g id="weather-rain"><path d="M7 19h17a5 5 0 0 0 .3-10A8.5 8.5 0 0 0 8.1 11.5 3.8 3.8 0 0 0 7 19Z"></path><path d="m10 23-2 4m8-4-2 4m8-4-2 4"></path></g>
          <g id="weather-thunder"><path d="M7 18h17a5 5 0 0 0 .3-10A8.5 8.5 0 0 0 8.1 10.5 3.8 3.8 0 0 0 7 18Z"></path><path class="bolt" d="m17 19-5 7h4l-1 5 6-8h-4Z"></path></g>
        </svg>
        <span id="temperature"></span>
      </div>
      <div id="clock"></div><div id="date"></div>
    </aside>
  </main>
  <script src="/app.js?v=3"></script>
</body>
</html>
